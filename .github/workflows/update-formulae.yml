name: update formulae

# Runs here rather than being pushed in from each project. A workflow may write
# to its own repository with the token it is handed, so a tap that updates
# itself needs no secret at all. The alternative is a personal access token in
# every project, each of which expires, and none of which can be copied from
# another because a secret cannot be read back once it is set.
on:
  schedule:
    # Hourly, and at seventeen past rather than on the hour: GitHub runs
    # scheduled workflows late when the minute is busy, and every whole hour is
    # the busiest minute there is.
    #
    # It was twice an hour, which was too often for how late these actually
    # start. Two scheduled runs met in the concurrency group below, the queued
    # one was cancelled, and a cancelled run is reported as a failed one. An
    # hour of headroom for a job that takes ten seconds is enough.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Not Formula/**: this workflow commits there, so listing it would make
    # every successful run start another one that has nothing left to do.
    paths:
      - "scripts/update_formulae.py"
      - ".github/workflows/update-formulae.yml"

permissions:
  contents: read

concurrency:
  # Two runs rewriting the same file would race, and the loser would push a
  # formula built from what the winner had already replaced. Never
  # cancel-in-progress: a run stopped between writing and pushing leaves a
  # branch nobody asked for.
  group: update-formulae
  cancel-in-progress: false

jobs:
  update:
    name: point every formula at its newest release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # contents only: there is no pull request to open any more.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: look for new releases
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_formulae.py

      - name: show what changed
        if: steps.update.outputs.changed == 'true'
        run: git diff --stat

      # Checked here rather than after the fact.
      #
      # A push made with the Actions token triggers no workflows, which is
      # GitHub's own loop prevention, so ci.yml will not run on what this job
      # writes however main is protected. The check has to live in the job that
      # does the writing, or it does not happen at all.
      #
      # The same `ruby -c` ci.yml runs, for the same reason it gives: it
      # catches the one failure a rewrite can actually cause, a file Homebrew
      # cannot parse, without a Homebrew install and a network round trip per
      # formula.
      - name: every formula is still valid ruby
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            ruby -c "$formula" >/dev/null
            echo "ok  $formula"
          done

      - name: commit straight to main
        # There is no pull request any more, and that is a decision rather than
        # a shortcut.
        #
        # It opened one for two days and merged none of them. A pull request
        # created with the Actions token triggers no workflows, so the checks
        # main required could never report; the token is not an administrator,
        # so it could not bypass them; and auto-merge is off for this
        # repository. Three piled up unmerged in one morning while the formula
        # sat behind, and the run went red for having done its job.
        #
        # What the pull request bought was review, and nobody reviews a
        # machine-written checksum. What it cost was a human pressing a button
        # for every release. So main takes the commit directly, the check that
        # mattered runs above before anything is pushed, and main keeps the two
        # rules that protect it from this job as much as from anybody: it
        # cannot be deleted and it cannot be force-pushed.
        if: steps.update.outputs.changed == 'true'
        run: |
          # The repository owner rather than the bot: GitHub counts a commit
          # author as a contributor, and this is the tap updating itself rather
          # than a second person turning up.
          git config user.name "sapn95"
          git config user.email "sapn95@users.noreply.github.com"

          git add Formula

          # A second opinion, from git rather than from the script. When the two
          # disagreed, `git commit` found nothing to commit, exited 1 under
          # `set -e`, and every scheduled run went red for a tap that was
          # completely up to date.
          if git diff --cached --quiet; then
            echo "the formulae were already correct, nothing to commit"
            exit 0
          fi

          git commit -m "Point the formulae at the newest releases"

          # Rebased rather than forced. Somebody may have pushed while this ran,
          # and this job's commit is never worth more than theirs.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
